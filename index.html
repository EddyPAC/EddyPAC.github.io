<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eduardo - Personal Page</title>
  <style>
    :root {
      --primary-color: #4a90e2;
      --text-color: #333;
      --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-color);
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 500px;
      width: 90%;
    }

    img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--primary-color);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 10px 0;
      color: #222;
      font-size: 2em;
    }

    p.bio {
      font-size: 1.1em;
      line-height: 1.6;
      color: #666;
      margin-bottom: 30px;
    }

    .footer {
      font-size: 0.9em;
      color: #999;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="ed.jpg" alt="Eduardo">
    <h1>Hello! I am Eduardo</h1>
    <p class="bio">
      Welcome to my personal page. I am a passionate developer exploring new technologies and building amazing projects. Stay tuned for more updates!
    </p>
    <div class="footer">
      This page is to be completed soon!
    </div>
  </div>

</body>
</html>
